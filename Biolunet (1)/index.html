<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E7D32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Biolunet" />
  <link rel="apple-touch-icon" href="assets/icons/apple-180.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Biolunet 🌙</title>
</head>
<body>
  <!-- Fondo cielo nocturno -->
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="moon" aria-hidden="true"></div>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="brand" data-nav="home">
      <span class="brand-moon">🌙</span>
      <span class="brand-name">Biolunet</span>
    </div>
    <button id="installBtn" class="install-btn" hidden>⬇️ Instalar</button>
  </header>

  <!-- Contenedor de vistas -->
  <main id="app"></main>

  <!-- Menú inferior móvil -->
  <nav class="bottom-nav" id="bottomNav">
    <button data-nav="home" class="active"><span>🏠</span>Inicio</button>
    <button data-nav="buscar"><span>🔍</span>Buscar</button>
    <button data-nav="glosario"><span>📖</span>Glosario</button>
    <button data-nav="progreso"><span>🏅</span>Progreso</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/contenido2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
